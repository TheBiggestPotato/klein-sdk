# Klein SDK CI: validate the distributable package without coupling it to a host.

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - package

default:
  image: node:22-bookworm-slim
  interruptible: true
  retry:
    max: 1
    when:
      - api_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - npm ci --prefer-offline

variables:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NPM_CONFIG_FUND: "false"

quality:
  stage: test
  timeout: 15m
  script:
    - npm run test:ci
    - npm pack --dry-run
  artifacts:
    expire_in: 1 day
    paths:
      - dist/

package-tarball:
  stage: package
  timeout: 10m
  needs:
    - job: quality
      artifacts: true
  before_script: []
  cache: []
  script:
    - mkdir -p artifacts
    - npm pack --pack-destination artifacts
  artifacts:
    expire_in: 30 days
    paths:
      - artifacts/*.tgz
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
