# Klein SDK CI: validate the distributable package without coupling it to a host.

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - package

default:
  image: node:22-bookworm-slim
  interruptible: true
  retry:
    max: 1
    when:
      - api_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - npm ci --prefer-offline

variables:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NPM_CONFIG_FUND: "false"

quality:
  stage: test
  timeout: 15m
  script:
    - npm run test:ci
    - npm pack --dry-run
  artifacts:
    expire_in: 1 day
    paths:
      - dist/

# ---------------------------------------------------------------------------
# Static analysis. Gated on a token existing, so a fork or a pipeline without
# access passes rather than failing on a secret it was never given.
#
# allow_failure because this reports on the code; the test jobs decide whether
# the code is releasable. An unreachable analysis server is not a merge blocker.
# ---------------------------------------------------------------------------
sonar:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1
    entrypoint: [""]
  timeout: 15m
  needs: []
  variables:
    # A shallow clone makes every line look new, and "new code" conditions
    # stop meaning anything.
    GIT_DEPTH: "0"
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    SONAR_PROJECT_KEY: "kleinmath_klein-sdk"
  cache:
    key: "sonar-$CI_COMMIT_REF_SLUG"
    paths:
      - .sonar/cache/
    policy: pull-push
  before_script: []
  script:
    - |
      ORG_ARG=""
      if [ -n "$SONAR_ORGANIZATION" ]; then
        ORG_ARG="-Dsonar.organization=$SONAR_ORGANIZATION"
      fi
      sonar-scanner -Dsonar.projectKey="$SONAR_PROJECT_KEY" $ORG_ARG
  allow_failure: true
  rules:
    - if: '$SONAR_TOKEN && $SONAR_HOST_URL'

package-tarball:
  stage: package
  timeout: 10m
  needs:
    - job: quality
      artifacts: true
  before_script: []
  cache: []
  script:
    - mkdir -p artifacts
    - npm pack --pack-destination artifacts
  artifacts:
    expire_in: 30 days
    paths:
      - artifacts/*.tgz
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
