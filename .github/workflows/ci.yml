# Klein SDK CI: validate the distributable package without coupling it to a
# host. The repository is public, so Actions minutes are unlimited and every
# job runs on every push.

name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the running one uninteresting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: 'false'
  NPM_CONFIG_FUND: 'false'

jobs:
  quality:
    # A pull request from a branch of this repository already ran on push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Static analysis. Gated on a token existing, so a fork or a run without
  # access passes rather than failing on a secret it was never given.
  #
  # continue-on-error because this reports on the code; the test jobs decide
  # whether the code is releasable. An unreachable analysis server is not a
  # merge blocker.
  sonar:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      # Secrets cannot be read in a job-level `if`, so a step decides.
      - name: Check the analysis secrets exist
        id: gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN and SONAR_HOST_URL are not both set; skipping the analysis."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          # A shallow clone makes every line look new, and "new code"
          # conditions stop meaning anything.
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v5
        if: steps.gate.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=kleinmath_klein-sdk
            ${{ secrets.SONAR_ORGANIZATION != '' && format('-Dsonar.organization={0}', secrets.SONAR_ORGANIZATION) || '' }}

  package-tarball:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
      && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The exact build the quality job tested, not a second one.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: klein-sdk-tarball
          path: artifacts/*.tgz
          retention-days: 30
