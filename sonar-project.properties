# Static analysis for the Klein SDK.
#
# Host and token come from repository secrets, never from this file.

# Required secrets, set with `gh secret set <NAME>` (or Settings > Secrets and
# variables > Actions):
#
#   SONAR_HOST_URL      https://sonarcloud.io for SonarQube Cloud, or the URL
#                       of a self-hosted instance.
#   SONAR_TOKEN         A project analysis token. Mask it, and protect it if
#                       analysis should only run on protected branches.
#   SONAR_ORGANIZATION  Cloud only. Left unset for a self-hosted server, and
#                       the job then omits the flag entirely.
#
# The analysis job skips until SONAR_HOST_URL and SONAR_TOKEN both exist, so
# nothing here breaks a workflow run before the account is set up.
#
sonar.projectKey=kleinmath_klein-sdk
sonar.projectName=Klein SDK
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests

# No coverage report, on purpose.
#
# The suite runs `node --test` against the built bundle in dist/, so the
# coverage Node produces describes dist/*.js — files Sonar does not analyse and
# would not know how to relate to src/*.ts. Wiring that back through source
# maps is a build change in service of a number nobody would act on. The tests
# are real and they run in CI; what is absent is a measurement of them, and
# saying so here is better than pointing Sonar at a report about the wrong
# files.

sonar.exclusions=\
  dist/**,\
  node_modules/**,\
  artifacts/**,\
  **/*.min.js
